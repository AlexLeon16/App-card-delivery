name: Java CI with Gradle

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT
        run: |
          java -jar ./artifacts/app-card-delivery.jar > sut.log 2>&1 &
          sleep 1
          echo "=== SUT log (first lines) ==="
          head -n 50 sut.log || true

      - name: Wait for SUT (localhost:9999)
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:9999 >/dev/null; then
              echo "SUT is up"
              exit 0
            fi
            echo "Waiting for SUT..."
            sleep 1
          done
          echo "SUT failed to start"
          echo "=== SUT log (last lines) ==="
          tail -n 200 sut.log || true
          exit 1

      - name: Run tests (headless)
        run: ./gradlew test --info -Dselenide.headless=true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Upload SUT log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sut-log
          path: sut.log
